openapi: 3.2.0
info:
  title: Pieces OS Local Formats API
  description: The Pieces OS local REST API.
  termsOfService: https://pieces.app/legal/terms
  contact:
    name: Pieces Support
    url: https://docs.pieces.app
  version: '1.0'
servers:
- url: http://localhost:1000
  description: Default on-device Pieces OS port (loopback only).
- url: http://localhost:5323
  description: Alternate on-device Pieces OS port.
tags:
- name: Formats
  description: Fragment representations that back each asset.
paths:
  /formats:
    get:
      operationId: getFormatsSnapshot
      tags:
      - Formats
      summary: Get a snapshot of all formats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Formats'
  /format/{format}:
    get:
      operationId: getFormat
      tags:
      - Formats
      summary: Get a single format by identifier
      parameters:
      - name: format
        in: path
        required: true
        description: The UUID of the format.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Format'
components:
  schemas:
    Formats:
      type: object
      properties:
        iterable:
          type: array
          items:
            $ref: '#/components/schemas/Format'
    Format:
      type: object
      properties:
        id:
          type: string
        classification:
          type: object
        fragment:
          type: object
